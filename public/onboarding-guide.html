<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hesi 完整介绍 — 内容更新中</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif;
      background: radial-gradient(circle at 50% 30%, #1a1530 0%, #0a0a0b 70%);
      min-height: 100vh; width: 100vw;
      display: flex; align-items: center; justify-content: center;
      color: #e6e6e6; padding: 24px;
    }
    .card {
      max-width: 480px; width: 100%; text-align: center;
      background: rgba(20, 20, 28, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px; padding: 44px 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 20px;
      background: linear-gradient(135deg, #7C3AED, #3B82F6);
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 900; color: #fff;
      box-shadow: 0 0 40px rgba(124, 58, 237, 0.45);
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; color: #fff; }
    .sub {
      display: inline-block; margin-bottom: 22px; padding: 4px 14px; border-radius: 999px;
      font-size: 13px; font-weight: 600; color: #F59E0B;
      background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.3);
    }
    p { font-size: 15px; line-height: 1.7; color: #b9b9c4; margin-bottom: 14px; }
    p strong { color: #e6e6e6; }
    .btn {
      display: inline-block; margin-top: 18px; padding: 11px 26px; border-radius: 999px;
      background: linear-gradient(135deg, #7C3AED, #6366f1); color: #fff; font-weight: 700;
      text-decoration: none; font-size: 14px; box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
      transition: transform .2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">H</div>
    <h1>Hesi 完整图文介绍</h1>
    <span class="sub">📖 内容更新中</span>
    <p>这份完整介绍页正在重新整理，<strong>稍后上线更贴合当前版本的图文指南</strong>。</p>
    <p>现在最快的上手方式：回到 Hesi，点左侧栏的 <strong>🚀 新手指南</strong> 按钮，跟着气泡一步步走即可。</p>
    <a class="btn" href="javascript:history.back()">← 返回 Hesi</a>
  </div>
</body>
</html>
